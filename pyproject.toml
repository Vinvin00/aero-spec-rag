[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-spec-rag"
version = "0.1.0"
description = "Retrieval-grounded aerospace parameter lookup built with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-chroma>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
]


[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ollama = ["langchain-ollama>=0.2"]

[project.scripts]
aero-ingest = "src.ingest:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
